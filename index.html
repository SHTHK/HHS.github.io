<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성황청 캐릭터 프로필 아카이브</title>
    <!-- 구글 폰트 적용 (성스러운 감성의 Serif & 깔끔한 Sans-serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* ===== 기본 CSS 변수 (하얀색 바탕 + 금색/빨간색 포인트) ===== */
        :root {
            --bg-color: #FAFAFA;
            --card-bg: #FFFFFF;
            --text-main: #1A1A1A;
            --text-sub: #555555;
            --gold-primary: #C5A059;
            --gold-light: #E8D8B0;
            --red-primary: #8B0000;
            --red-light: #FADBD8;
            --border-color: #E2D8C3;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans KR', sans-serif;
            line-height: 1.6;
            word-break: keep-all;
        }

        /* ===== 헤더 ===== */
        header {
            background-color: #FFFFFF;
            border-bottom: 2px solid var(--gold-primary);
            padding: 2rem 1rem;
            text-align: center;
        }

        header h1 {
            font-family: 'Cinzel', 'Noto Serif KR', serif;
            color: var(--red-primary);
            font-size: 2rem;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--gold-primary);
            font-size: 0.9rem;
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
        }

        /* ===== 컨테이너 ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* ===== 필터 버튼 ===== */
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: #FFFFFF;
            border: 1px solid var(--gold-primary);
            color: var(--text-main);
            padding: 0.6rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--red-primary);
            color: #FFFFFF;
            border-color: var(--red-primary);
        }

        /* ===== 메인 캐릭터 그리드 ===== */
        .section-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.5rem;
            color: var(--red-primary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin: 2.5rem 0 1.5rem 0;
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .character-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            cursor: pointer;
            text-align: center;
            padding: 12px;
            box-shadow: var(--shadow);
        }

        /* 메인 화면 1:1 이미지 비율 & 이미지 효과 제거 */
        .card-img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background-color: #EAEAEA;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            /* 이미지 효과/필터 없음 */
        }

        .card-name {
            font-family: 'Noto Serif KR', serif;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .card-subname {
            font-size: 0.8rem;
            color: var(--gold-primary);
        }

        /* ===== 프로필 상세 페이지 ===== */
        #profile-view {
            display: none;
        }

        .back-btn {
            display: inline-block;
            background: none;
            border: 1px solid var(--red-primary);
            color: var(--red-primary);
            padding: 0.5rem 1.2rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 2rem;
        }

        .back-btn:hover {
            background-color: var(--red-primary);
            color: #FFFFFF;
        }

        .profile-layout {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--gold-primary);
            padding: 2rem;
            box-shadow: var(--shadow);
        }

        @media (min-width: 768px) {
            .profile-layout {
                flex-direction: row;
            }
        }

        /* 프로필 화면 2:3 이미지 비율 & 이미지 효과 제거 */
        .profile-img-container {
            flex: 0 0 300px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }

        .profile-img-wrapper {
            width: 100%;
            aspect-ratio: 2 / 3;
            overflow: hidden;
            background-color: #EAEAEA;
            border: 1px solid var(--border-color);
        }

        .profile-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            /* 이미지 효과/필터 없음 */
        }

        .profile-info {
            flex: 1;
        }

        .profile-header {
            border-bottom: 2px solid var(--gold-primary);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .profile-group {
            font-size: 0.9rem;
            color: var(--gold-primary);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .profile-title-group {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

        .profile-name {
            font-family: 'Noto Serif KR', serif;
            font-size: 2.2rem;
            color: var(--red-primary);
        }

        .profile-realname {
            font-size: 1.1rem;
            color: var(--text-sub);
        }

        /* 테이블 형태 메타 데이터 */
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
            background-color: var(--bg-color);
            padding: 1rem;
            border: 1px solid var(--border-color);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
        }

        .meta-label {
            font-size: 0.8rem;
            color: var(--gold-primary);
            font-weight: 600;
        }

        .meta-value {
            font-size: 1rem;
            font-weight: 500;
        }

        /* 장문 데이터 (성격, 특징 등) */
        .detail-block {
            margin-bottom: 1.5rem;
        }

        .detail-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.1rem;
            color: var(--red-primary);
            border-left: 3px solid var(--red-primary);
            padding-left: 8px;
            margin-bottom: 0.5rem;
        }

        .detail-content {
            font-size: 0.98rem;
            color: var(--text-main);
            background: #FAFAFA;
            padding: 1rem;
            border: 1px solid var(--border-color);
            white-space: pre-line; /* 줄바꿈 유지 */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ================= 메인 화면 ================= -->

        /* ===== 화면 전환 및 필터링 로직 ===== */

        function renderMainView(filter = 'all') {
            const container = document.getElementById('character-sections');
            container.innerHTML = '';

            const groups = [
                { key: 'sacrum', title: '사크룸 2팀' },
                { key: 'angel', title: '천사 팀 (ANGEL)' },
                { key: 'cardinal', title: '추기경 (CARDINAL)' }
            ];

            groups.forEach(g => {
                if (filter !== 'all' && filter !== g.key) return;

                const groupChars = characters.filter(c => c.group === g.key);
                if (groupChars.length === 0) return;

                const section = document.createElement('div');
                section.innerHTML = `<h2 class="section-title">${g.title}</h2>`;

                const grid = document.createElement('div');
                grid.className = 'character-grid';

                groupChars.forEach(char => {
                    const card = document.createElement('div');
                    card.className = 'character-card';
                    card.onclick = () => openProfile(char.id);

                    // 이름 표시 설정 (천사 팀은 활동명 우선)
                    const displayName = char.codeName ? char.codeName : char.name;
                    const subName = char.realName ? `(${char.realName})` : (char.groupRole ? `[${char.groupRole}]` : '');

                    card.innerHTML = `
                        <div class="card-img-wrapper">
                            <img src="images/thumb_${char.id}.jpg" onerror="this.src='https://via.placeholder.com/300x300/e0e0e0/999999?text=${encodeURIComponent(displayName)}'" alt="${displayName}">
                        </div>
                        <div class="card-name">${displayName}</div>
                        ${subName ? `<div class="card-subname">${subName}</div>` : ''}
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function filterGroup(groupKey) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderMainView(groupKey);
        }

        function openProfile(id) {
            const char = characters.find(c => c.id === id);
            if (!char) return;

            // 기본 텍스트 셋팅
            document.getElementById('detail-group').innerText = char.groupName + (char.groupRole ? ` · ${char.groupRole}` : '');
            
            if (char.codeName) {
                document.getElementById('detail-name').innerText = char.codeName;
                document.getElementById('detail-subname').innerText = `본명: ${char.realName}`;
            } else {
                document.getElementById('detail-name').innerText = char.name;
                document.getElementById('detail-subname').innerText = '';
            }

            // 상세 이미지 (2:3)
            const detailImg = document.getElementById('detail-img');
            const displayName = char.codeName ? char.codeName : char.name;
            detailImg.src = `images/detail_${char.id}.jpg`;
            detailImg.onerror = function() {
                this.src = `https://via.placeholder.com/400x600/e0e0e0/999999?text=${encodeURIComponent(displayName)}`;
            };

            // 소속별 가변 메타 정보 구성
            const metaContainer = document.getElementById('detail-meta');
            metaContainer.innerHTML = '';

            let metaHTML = `
                <div class="meta-item"><span class="meta-label">성별</span><span class="meta-value">${char.gender}</span></div>
                <div class="meta-item"><span class="meta-label">나이</span><span class="meta-value">${char.age}</span></div>
            `;

            if (char.exp) {
                metaHTML += `<div class="meta-item"><span class="meta-label">경력</span><span class="meta-value">${char.exp}</span></div>`;
            }
            if (char.weapon) {
                metaHTML += `<div class="meta-item"><span class="meta-label">전용 무기</span><span class="meta-value">${char.weapon}</span></div>`;
            }

            metaContainer.innerHTML = metaHTML;

            // 긴 텍스트
            document.getElementById('detail-personality').innerText = char.personality;
            document.getElementById('detail-features').innerText = char.features;

            // 뷰 전환
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('profile-view').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function showMainView() {
            document.getElementById('profile-view').style.display = 'none';
            document.getElementById('main-view').style.display = 'block';
        }

        // 초기 실행
        window.onload = () => {
            renderMainView('all');
        };
    </script>
</body>
</html>
